org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# 02.10: "Caught exception: Already watching path: /app/android" during a
# build inside the Docker bind-mount on this NAS - Gradle's native
# filesystem watcher doesn't get on with this mount, build hung for an
# hour producing nothing. Disabling it costs a little incremental-build
# speed, not correctness.
org.gradle.vfs.watch=false
android.useAndroidX=true
android.enableJetifier=true
android.builtInKotlin=false
android.newDsl=false
