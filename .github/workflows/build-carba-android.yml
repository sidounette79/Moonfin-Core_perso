name: Build CARBA TV Android

# 28.09, Sid: "donc moi je dois chaque fois lancer le build ?" - separate,
# minimal workflow so pushing to carba-tv-changes builds the Android APK
# automatically, without needing the manual "Run workflow" click every
# time. Deliberately its own file rather than adding a push trigger to
# build.yml - that workflow's every job (ios, macos, windows...) shares a
# condition that also runs on any non-workflow_dispatch event, so a push
# trigger there would rebuild every platform on every push, not just
# Android.

on:
  push:
    branches: [carba-tv-changes]
    # 09.10, Sid ("j'ai trois TV, 3 tél + 3 tablettes + 2 voitures...
    # réinstaller l'APK à chaque fois est lourd"): a plain push publishes a
    # Shorebird OTA patch (no reinstall) - see SHOREBIRD_MODE below. Pushing
    # a version tag instead (after a native change - new plugin, Gradle/
    # manifest edit, anything Dart-patching can't cover) does a real
    # release, which still needs a manual reinstall but becomes the new OTA
    # base. No "v" prefix - matches this repo's existing tag convention
    # (2.6.0, 2.5.1, ... - plain "git tag"/"git push --tags", not previously
    # wired to any CI trigger).
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  # 09.10: manual escape hatch, mainly for the very first Shorebird release
  # (no existing tag push will re-trigger on a tag that's already there) and
  # for re-running a release/patch without needing a throwaway tag.
  workflow_dispatch:
    inputs:
      shorebird_mode:
        description: 'Shorebird: release (new OTA base) or patch (OTA update)'
        type: choice
        options: [patch, release]
        default: patch

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Shorebird CLI
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | bash
          echo "$HOME/.shorebird/bin" >> "$GITHUB_PATH"

      - name: Set up signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No Android keystore secret; skipping release signing (debug-signed build)."
            exit 0
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storeType=$STORE_TYPE
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          if [ -n "$STORE_TYPE" ]; then
            keytool -list -v -keystore android/app/release.keystore -storetype "$STORE_TYPE" -storepass "$STORE_PASSWORD" >/dev/null
          else
            keytool -list -v -keystore android/app/release.keystore -storepass "$STORE_PASSWORD" >/dev/null
          fi

      - name: Build
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          # 09.10: a version tag (2.6.1, ...) = real release (new OTA base,
          # needs reinstall). A plain branch push = OTA patch of the
          # existing release, the everyday case. Manual run uses whatever
          # was picked in the dropdown. See build-android.sh's
          # SHOREBIRD_MODE handling.
          SHOREBIRD_MODE: ${{ github.event.inputs.shorebird_mode || (startsWith(github.ref, 'refs/tags/') && 'release' || 'patch') }}
        run: |
          chmod +x build-android.sh
          ./build-android.sh

      - uses: actions/upload-artifact@v4
        # A Shorebird patch (SHOREBIRD_MODE=patch, the common case) produces
        # no APK/AAB - it's a binary diff pushed straight to Shorebird's
        # servers, see build-android.sh. Nothing to upload then; only a
        # release (same condition as SHOREBIRD_MODE above) produces real
        # files here.
        if: github.event.inputs.shorebird_mode == 'release' || (!github.event.inputs.shorebird_mode && startsWith(github.ref, 'refs/tags/'))
        with:
          name: android
          path: |
            Moonfin_Android_v*.*
            Moonfin_AndroidTV_v*.*
